name: Update Docs
description: >
  Analyzes toride source code against the docs site and updates
  documentation to reflect the current codebase with user-friendly examples.
version: "2.0"
start_at: collect_data
max_loop: 3

states:
  collect_data:
    type: task
    provider: system
    command: "bash .fdsx/workflows/update-docs/collect_data.sh"
    result_path: $.collected_data
    next: analyze

  analyze:
    type: task
    profile: smarty
    prompt_file: analyze.md
    result_path: $.analysis
    extract:
      strategy:
        - keyword
      pattern: "CHANGES_NEEDED|UP_TO_DATE"
      result_path: $.analyze_decision
    retry: 2
    next: analyze_route

  analyze_route:
    type: choice
    choices:
      - variable: $.analyze_decision
        operator: equals
        value: CHANGES_NEEDED
        next: update_docs
    default: done_no_changes

  update_docs:
    type: task
    profile: smarty
    prompt_file: update_docs.md
    result_path: $.updated_docs
    next: done_with_changes

  done_with_changes:
    type: task
    provider: system
    command: |
      echo "Documentation updated successfully."
      echo "Changed files:"
      git diff --name-only -- docs/
      echo ""
      echo "Summary of changes:"
      git diff --stat -- docs/
    result_path: $.final_message
    end: true

  done_no_changes:
    type: task
    provider: system
    command: "echo 'Documentation is already up to date. No changes needed.'"
    result_path: $.final_message
    end: true
